<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>许博仁 & 蔡银坤 · 婚礼邀请</title>
    <meta name="description" content="许博仁 & 蔡银坤 诚邀您参加我们的婚礼 — 2026年10月3日 · 河北省保定市易县好年景大酒店">
    <meta name="theme-color" content="#f9ecd9">
    <!-- favicon（内联，无需图片文件） -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💍</text></svg>">
    <!-- 分享到微信 / QQ / iMessage 时的卡片信息 -->
    <meta property="og:title" content="许博仁 & 蔡银坤 · 婚礼邀请">
    <meta property="og:description" content="2026.10.03 · 河北省保定市易县好年景大酒店 · 恭候您的光临">
    <meta property="og:image" content="https://bonn12138.github.io/wedding/assets/images/main.jpg">
    <style>
        /* 全局重置 — 纯白到香槟色渐变背景 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(180deg, #ffffff 0%, #fefcf8 30%, #fdf8f0 60%, #f9ecd9 100%);
            background-attachment: fixed;
            font-family: 'Inter', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px 16px;
            line-height: 1.5;
            color: #2c2c2c;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* 主卡片 — 半透明白，与渐变融合，纯净优雅 */
        .invitation-card {
            max-width: 600px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.06), 0 10px 30px -8px rgba(0, 0, 0, 0.02);
            padding: 44px 36px 40px;
            text-align: center;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* 顶部装饰线 */
        .ornament {
            margin: 0 auto 28px;
            width: 48px;
            height: 2px;
            background: #d9c6a9;
            border-radius: 2px;
        }

        /* 新人姓名 */
        .couple-names {
            font-size: 3rem;
            font-weight: 400;
            letter-spacing: 5px;
            color: #1e1e1e;
            line-height: 1.2;
            margin-bottom: 16px;
            font-family: 'Cormorant Garamond', 'Times New Roman', 'Songti SC', serif;
            text-transform: uppercase;
        }

        .couple-names span {
            display: inline-block;
            margin: 0 8px;
            font-weight: 300;
            color: #c2a57a;
            font-size: 2.2rem;
            transform: translateY(-2px);
        }

        /* 日期 */
        .wedding-date {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 6px;
            color: #777;
            margin-bottom: 28px;
            text-transform: uppercase;
        }

        /* 农历日期行 — 香槟色调，柔和居中 */
        .lunar-date {
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 2px;
            color: #b49b78;
            margin-top: -16px;
            margin-bottom: 28px;
            font-family: 'Noto Serif SC', 'Songti SC', serif;
        }

        /* 照片区域 — 主次分明布局 */
        .photo-gallery {
            width: 100%;
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 主照片 — 有图时显示图片，无图时显示占位样式 */
        .main-photo {
            width: 100%;
            aspect-ratio: 3 / 2;
            background: #faf5ed;
            border-radius: 24px;
            border: 1px solid #e9dcc8;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #b5a18a;
            font-size: 1rem;
            letter-spacing: 1.5px;
            transition: transform 0.2s;
            padding: 20px;
            overflow: hidden;
        }

        .main-photo i {
            font-style: normal;
            font-size: 2.8rem;
            margin-bottom: 12px;
            color: #cdba9d;
            font-weight: 200;
            line-height: 1;
        }
        .main-photo span {
            font-size: 0.8rem;
            color: #bba88d;
        }

        /* 照片加载成功后的显示规则（主图与副图通用） */
        .main-photo img,
        .secondary-photo img {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .main-photo.has-photo,
        .secondary-photo.has-photo {
            padding: 0;
            background: none;
        }
        .main-photo.has-photo img,
        .secondary-photo.has-photo img {
            display: block;
        }
        .main-photo.has-photo :not(img),
        .secondary-photo.has-photo :not(img) {
            display: none;
        }

        /* 次要照片 — 四张整齐排列 */
        .secondary-photos {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
        }

        .secondary-photo {
            aspect-ratio: 1 / 1;
            background: #faf7f0;
            border-radius: 16px;
            border: 1px solid #eee3d3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #b5a18a;
            font-size: 0.65rem;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            transition: transform 0.2s;
            padding: 8px;
            text-align: center;
            overflow: hidden;
        }

        .secondary-photo i {
            font-style: normal;
            font-size: 1.5rem;
            margin-bottom: 4px;
            color: #cdba9d;
            font-weight: 200;
        }

        .secondary-photo span {
            font-size: 0.6rem;
            color: #bbaa93;
            line-height: 1.3;
        }

        /* 婚礼信息 */
        .details {
            text-align: left;
            margin-bottom: 28px;
            background: transparent;
            padding: 8px 0;
        }

        .detail-item {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 12px;
            font-size: 1rem;
            padding: 12px 0;
            color: #3a3a3a;
            border-bottom: 1px solid rgba(210, 190, 160, 0.3);
        }

        .detail-item:last-of-type {
            border-bottom: none;
        }

        .detail-label {
            font-weight: 500;
            letter-spacing: 1px;
            color: #9e8b72;
            min-width: 72px;
            text-align: right;
            font-size: 0.9rem;
        }

        .detail-value {
            font-weight: 400;
            color: #2e2e2e;
            letter-spacing: 1px;
            text-align: left;
            flex: 1;
        }

        .location-highlight {
            font-weight: 500;
            color: #1a1a1a;
        }

        /* 恭候光临 — 独立香槟色居中区块 */
        .greeting-line {
            margin: 20px 0 10px;
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: #b49b78;      /* 香槟色调 */
            font-weight: 400;
            text-align: center;  /* 居中 */
            border-top: 1px solid rgba(210, 190, 160, 0.3);
            padding-top: 20px;
            font-family: 'Noto Serif SC', 'Songti SC', serif;
        }

        /* 音乐控制区 */
        .music-section {
            margin: 12px 0 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .music-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid #d9c7ae;
            border-radius: 30px;
            padding: 8px 22px;
            cursor: pointer;
            transition: all 0.25s ease;
            color: #6b5d4b;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            font-weight: 400;
            user-select: none;
        }

        .music-toggle:hover {
            background: rgba(255, 250, 240, 0.9);
            border-color: #bfa888;
        }

        .music-icon {
            font-size: 1.2rem;
            line-height: 1;
        }

        .music-hint {
            font-size: 0.7rem;
            color: #ae9c86;
            letter-spacing: 1px;
        }

        .divider-light {
            width: 70px;
            height: 1.5px;
            background: #dacbad;
            margin: 24px auto 18px;
            border-radius: 1px;
        }

        /* RSVP 区域 */
        .rsvp-section {
            margin-top: 8px;
        }

        .rsvp-title {
            font-size: 0.95rem;
            letter-spacing: 3px;
            color: #7f6e5a;
            margin-bottom: 18px;
            font-weight: 400;
            text-transform: uppercase;
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
        }

        .input-row {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 340px;
            gap: 6px;
        }

        .input-label {
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: #9e8b72;
            text-align: left;
        }

        .name-input,
        .phone-input,
        .select-input {
            width: 100%;
            padding: 13px 18px;
            border: 1px solid #ddd0bd;
            border-radius: 40px;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            text-align: center;
            background: rgba(255, 255, 255, 0.8);
            color: #2c2c2c;
            outline: none;
            transition: all 0.25s ease;
            font-family: inherit;
            backdrop-filter: blur(4px);
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        .name-input::placeholder,
        .phone-input::placeholder {
            color: #b9a88f;
            letter-spacing: 1px;
            font-weight: 300;
        }

        .name-input:focus,
        .phone-input:focus,
        .select-input:focus {
            border-color: #bfa888;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(190, 168, 136, 0.1);
        }

        .select-input {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8" viewBox="0 0 12 8"><path fill="%23b49b78" d="M6 8L0 0h12z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 18px center;
            padding-right: 40px;
        }

        .submit-btn {
            background: #ffffffd9;
            border: 1px solid #cbb694;
            color: #4a3f31;
            padding: 12px 36px;
            border-radius: 40px;
            font-size: 0.9rem;
            letter-spacing: 3px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            background: #fcf7f0;
            margin-top: 8px;
            width: fit-content;
            font-family: inherit;
            backdrop-filter: blur(4px);
        }

        .submit-btn:hover {
            background: #f7efe4;
            border-color: #ae9472;
            letter-spacing: 4px;
        }

        .submit-btn:active {
            background: #efe3d3;
            transform: scale(0.98);
        }

        .submission-message {
            margin-top: 18px;
            font-size: 0.85rem;
            color: #6b5d4b;
            letter-spacing: 1px;
            min-height: 24px;
            transition: opacity 0.3s;
            text-align: center;
        }

        /* 问卷跳转模式下的提示行 */
        .survey-hint {
            margin-top: 10px;
            font-size: 0.7rem;
            color: #ae9c86;
            letter-spacing: 1px;
            text-align: center;
        }

        .footer-note {
            margin-top: 26px;
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: #bcab94;
            text-transform: uppercase;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .invitation-card {
                padding: 36px 22px 32px;
                border-radius: 28px;
            }
            .couple-names {
                font-size: 2.4rem;
                letter-spacing: 3px;
            }
            .couple-names span {
                font-size: 1.8rem;
                margin: 0 5px;
            }
            .wedding-date {
                font-size: 0.9rem;
                letter-spacing: 4px;
            }
            .lunar-date {
                font-size: 0.8rem;
                margin-top: -12px;
                margin-bottom: 24px;
            }
            .main-photo {
                aspect-ratio: 4/3;
            }
            .secondary-photos {
                gap: 8px;
            }
            .detail-item {
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
            }
            .detail-label {
                min-width: auto;
                text-align: center;
                width: 100%;
                margin-bottom: -6px;
            }
            .detail-value {
                text-align: center;
                width: 100%;
            }
            .greeting-line {
                font-size: 1rem;
                letter-spacing: 2px;
            }
            .input-row {
                max-width: 280px;
            }
        }
    </style>
</head>
<body>
    <main class="invitation-card">
        <div class="ornament"></div>

        <!-- 新人姓名 许博仁 & 蔡银坤 -->
        <h1 class="couple-names">
            许博仁 <span>&</span> 蔡银坤
        </h1>

        <!-- 日期 2026.10.03 及农历 -->
        <div class="wedding-date">
            2026.10.03
        </div>
        <div class="lunar-date">
            农历丙午年 八月廿三 · 星期六
        </div>

        <!-- 照片区域：把照片放入 assets/images/ 即自动显示，无图时显示占位样式 -->
        <div class="photo-gallery">
            <div class="main-photo">
                <img src="assets/images/main.jpg" alt="许博仁与蔡银坤的婚纱照"
                     onload="this.parentElement.classList.add('has-photo')" onerror="this.remove()">
                <i>🖼️</i>
                <span class="ph-text">主婚纱照预留</span>
                <span>放入 assets/images/main.jpg（建议 1200×800）</span>
            </div>
            <div class="secondary-photos">
                <div class="secondary-photo">
                    <img src="assets/images/photo1.jpg" alt="婚纱照一"
                         onload="this.parentElement.classList.add('has-photo')" onerror="this.remove()">
                    <i>🖼️</i>
                    <span>照片1</span>
                </div>
                <div class="secondary-photo">
                    <img src="assets/images/photo2.jpg" alt="婚纱照二"
                         onload="this.parentElement.classList.add('has-photo')" onerror="this.remove()">
                    <i>🖼️</i>
                    <span>照片2</span>
                </div>
                <div class="secondary-photo">
                    <img src="assets/images/photo3.jpg" alt="婚纱照三"
                         onload="this.parentElement.classList.add('has-photo')" onerror="this.remove()">
                    <i>🖼️</i>
                    <span>照片3</span>
                </div>
                <div class="secondary-photo">
                    <img src="assets/images/photo4.jpg" alt="婚纱照四"
                         onload="this.parentElement.classList.add('has-photo')" onerror="this.remove()">
                    <i>🖼️</i>
                    <span>照片4</span>
                </div>
            </div>
        </div>

        <!-- 婚礼信息 -->
        <div class="details">
            <div class="detail-item">
                <span class="detail-label">地点</span>
                <span class="detail-value location-highlight">河北省保定市易县好年景大酒店</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">时间</span>
                <span class="detail-value">2026年10月3日 · 星期六</span>
            </div>
        </div>

        <!-- 恭候光临 — 香槟色居中独立行 -->
        <div class="greeting-line">恭 候 您 的 光 临</div>

        <!-- 背景音乐：放入 assets/music/bgm.mp3 后自动出现控制按钮 -->
        <div class="music-section" id="musicSection">
            <div class="music-toggle" id="musicToggle" role="button" aria-label="背景音乐开关" tabindex="0">
                <span class="music-icon" id="musicIcon">🎵</span>
                <span id="musicText">播放音乐</span>
            </div>
            <span class="music-hint">轻触开启 · 再次轻触暂停</span>
        </div>

        <div class="divider-light"></div>

        <!-- RSVP 区域：姓名 + 住宿需求 + 联系电话 -->
        <div class="rsvp-section">
            <div class="rsvp-title">确认出席 · 信息登记</div>
            <div class="form-grid">
                <div class="input-row">
                    <label class="input-label" for="guestName">您的姓名</label>
                    <input type="text" id="guestName" class="name-input" placeholder="请输入姓名" autocomplete="name" aria-label="受邀者姓名">
                </div>
                <div class="input-row">
                    <label class="input-label" for="needAccommodation">是否需要住宿</label>
                    <select id="needAccommodation" class="select-input" aria-label="是否需要住宿">
                        <option value="" selected disabled>请选择</option>
                        <option value="需要">需要</option>
                        <option value="不需要">不需要</option>
                        <option value="待定">待定</option>
                    </select>
                </div>
                <div class="input-row">
                    <label class="input-label" for="phoneNumber">联系电话</label>
                    <input type="tel" id="phoneNumber" class="phone-input" placeholder="请输入手机号码" autocomplete="tel" aria-label="联系电话">
                </div>
                <button id="submitFormBtn" class="submit-btn" type="button">提交登记</button>
                <div class="survey-hint" id="surveyHint" style="display:none;">
                    填写后点击，信息将自动带入腾讯问卷，确认提交即可
                </div>
            </div>
            <div id="confirmationMessage" class="submission-message"></div>
        </div>

        <div class="footer-note">· 诚挚邀请 ·</div>
    </main>

    <audio id="bgMusic" loop preload="none" style="display: none;">
        <source src="assets/music/bgm.mp3" type="audio/mpeg">
    </audio>

    <script>
        (function() {
            // ===== 配置：腾讯问卷链接与参数预填 =====
            // SURVEY_URL：问卷发布链接，留空 '' 则使用纯本地登记模式。
            // PREFILL_PARAMS：参数预填映射。在腾讯问卷编辑页为每道题设置"参数名"
            // （题目设置中的 链接传参/参数名 选项），并把参数名按下面格式填好，
            // 跳转时本页已填信息会自动带入问卷对应题目，宾客确认后提交即可。
            // 若问卷侧未配置参数名，则跳转不带参数，问卷正常打开（宾客手动填写），不影响使用。
            const SURVEY_URL = 'https://wj.qq.com/s2/27676227/xenf/';
            const PREFILL_PARAMS = {
                name: 'name',           // "您的姓名"题的参数名
                accommodation: 'stay',  // "是否需要住宿"题的参数名
                phone: 'phone'          // "联系电话"题的参数名
            };

            // ----- 获取表单元素 -----
            const nameInput = document.getElementById('guestName');
            const accommodationSelect = document.getElementById('needAccommodation');
            const phoneInput = document.getElementById('phoneNumber');
            const submitBtn = document.getElementById('submitFormBtn');
            const messageDiv = document.getElementById('confirmationMessage');
            const storageKey = 'wedding_guest_details_bodhi_yin';

            // 尝试读取之前保存的信息（如果有）
            function loadStoredData() {
                try {
                    const stored = localStorage.getItem(storageKey);
                    if (stored) {
                        const data = JSON.parse(stored);
                        if (data.name) {
                            nameInput.value = data.name || '';
                            if (data.accommodation) accommodationSelect.value = data.accommodation;
                            if (data.phone) phoneInput.value = data.phone;
                            messageDiv.textContent = `欢迎回来，${data.name}。如需修改信息可直接更新。`;
                            messageDiv.style.color = '#6b5d4b';
                        }
                    }
                } catch (e) {}
            }

            // 提交登记信息
            function handleSubmit() {
                // 问卷模式：带参数跳转腾讯问卷，由问卷后台收集与统计
                if (SURVEY_URL) {
                    // 读取页面已填信息，映射为问卷参数（只带已填写的项）
                    const values = {
                        name: nameInput.value.trim(),
                        accommodation: accommodationSelect.value,
                        phone: phoneInput.value.trim()
                    };
                    const params = new URLSearchParams();
                    let filled = 0;
                    Object.keys(PREFILL_PARAMS).forEach(key => {
                        const v = values[key];
                        if (v) {
                            params.append(PREFILL_PARAMS[key], v);
                            filled++;
                        }
                    });

                    messageDiv.textContent = filled > 0
                        ? '正在为您跳转登记问卷，信息已自动带入…'
                        : '正在为您跳转登记问卷…';
                    messageDiv.style.color = '#6b5d4b';

                    const joiner = SURVEY_URL.includes('?') ? '&' : '?';
                    window.open(SURVEY_URL + (filled > 0 ? joiner + params.toString() : ''), '_blank');
                    return;
                }

                const rawName = nameInput.value.trim();
                const accommodation = accommodationSelect.value;
                const phone = phoneInput.value.trim();

                // 基本验证
                if (rawName === '') {
                    messageDiv.textContent = '请填写您的姓名。';
                    messageDiv.style.color = '#b33a3a';
                    nameInput.focus();
                    return;
                }
                const namePattern = /^[一-龥A-Za-z\s·.]+$/;
                if (!namePattern.test(rawName)) {
                    messageDiv.textContent = '姓名格式似乎不太对，请使用中文、英文或空格。';
                    messageDiv.style.color = '#b33a3a';
                    return;
                }
                if (accommodation === '') {
                    messageDiv.textContent = '请选择是否需要住宿。';
                    messageDiv.style.color = '#b33a3a';
                    accommodationSelect.focus();
                    return;
                }
                // 电话可选，但如果填写则简单校验
                if (phone !== '') {
                    const phonePattern = /^[0-9+\-\s]{6,20}$/;
                    if (!phonePattern.test(phone)) {
                        messageDiv.textContent = '联系电话格式可能不正确，请检查。';
                        messageDiv.style.color = '#b33a3a';
                        phoneInput.focus();
                        return;
                    }
                }

                // 构建数据对象并存储
                const formData = {
                    name: rawName,
                    accommodation: accommodation,
                    phone: phone,
                    timestamp: new Date().toISOString()
                };
                try {
                    localStorage.setItem(storageKey, JSON.stringify(formData));
                } catch (e) {}

                // 成功提示
                messageDiv.textContent = `感谢您的回复，${rawName}！住宿: ${accommodation}${phone ? '，电话: '+phone : ''}。期待与您相聚。`;
                messageDiv.style.color = '#3f6e4a';
            }

            submitBtn.addEventListener('click', handleSubmit);

            // 回车提交
            [nameInput, phoneInput].forEach(input => {
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        handleSubmit();
                    }
                });
            });

            // 问卷模式下：保留本地表单用于预填，提交时带入问卷；同时更新提示
            if (SURVEY_URL) {
                submitBtn.textContent = '一键登记';
                const hint = document.getElementById('surveyHint');
                hint.style.display = 'block';
                hint.textContent = '填写后点击，信息将自动带入腾讯问卷，确认提交即可';
            }

            // 加载已有数据
            loadStoredData();

            // ----- 背景音乐控制 -----
            const musicSection = document.getElementById('musicSection');
            const musicToggle = document.getElementById('musicToggle');
            const musicIcon = document.getElementById('musicIcon');
            const musicText = document.getElementById('musicText');
            const bgMusic = document.getElementById('bgMusic');
            let isPlaying = false;

            // 若 assets/music/bgm.mp3 尚未放置，隐藏音乐控制区
            fetch('assets/music/bgm.mp3', { method: 'HEAD' })
                .then(res => { if (!res.ok) musicSection.style.display = 'none'; })
                .catch(() => { musicSection.style.display = 'none'; });

            function toggleMusic() {
                if (isPlaying) {
                    bgMusic.pause();
                    bgMusic.currentTime = 0;
                    musicIcon.textContent = '🎵';
                    musicText.textContent = '播放音乐';
                    isPlaying = false;
                } else {
                    bgMusic.play().catch(() => {});
                    musicIcon.textContent = '🎶';
                    musicText.textContent = '暂停音乐';
                    isPlaying = true;
                }
            }
            musicToggle.addEventListener('click', toggleMusic);
            musicToggle.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleMusic();
                }
            });
        })();
    </script>
</body>
</html>
