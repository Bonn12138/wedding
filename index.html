<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>许博仁 & 蔡银坤 · 婚礼邀请</title>
    <meta name="description" content="许博仁 & 蔡银坤 诚邀您参加我们的婚礼 — 2026年10月3日 · 河北省保定市易县好年景烤鸭店">
    <meta name="theme-color" content="#f9ecd9">
    <!-- favicon（内联，无需图片文件） -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💍</text></svg>">
    <!-- 分享到微信 / QQ / iMessage 时的卡片信息 -->
    <meta property="og:title" content="许博仁 & 蔡银坤 · 婚礼邀请">
    <meta property="og:description" content="2026.10.03 · 河北省保定市易县好年景烤鸭店 · 恭候您的光临">
    <meta property="og:image" content="https://bonn12138.github.io/wedding/assets/images/main.jpg">
    <!-- 古风字体：汇文明朝体（自托管子集，仅加载页面用到的字） -->
    <link rel="stylesheet" href="assets/fonts/huiwen-mincho/index.css">
    <style>
        /* 全局重置 — 纯白到香槟色渐变背景 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(180deg, #ffffff 0%, #fefcf8 30%, #fdf8f0 60%, #f9ecd9 100%);
            background-attachment: fixed;
            font-family: 'Inter', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px 16px;
            line-height: 1.5;
            color: #2c2c2c;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* 主卡片 — 半透明白，与渐变融合；金色古典双线框：外线 + 内线 + 四角回纹 + 边中菱珠 */
        .invitation-card {
            position: relative;
            max-width: 600px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 24px;
            border: 1.5px solid #c9b08a;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.06), 0 10px 30px -8px rgba(0, 0, 0, 0.02);
            padding: 44px 36px 40px;
            text-align: center;
            transition: all 0.2s ease;
        }

        /* 内圈细线：与外线平行相隔 7px，四边中点各缀一颗金色菱珠 */
        .invitation-card::before {
            content: "";
            position: absolute;
            inset: 7px;
            border: 1px solid rgba(201, 176, 138, 0.9);
            border-radius: 17px;
            pointer-events: none;
            z-index: 1;
            background:
                radial-gradient(circle, #c9b08a 0 2.5px, transparent 2.5px) 50% 0 / 12px 12px no-repeat,
                radial-gradient(circle, #c9b08a 0 2.5px, transparent 2.5px) 50% 100% / 12px 12px no-repeat,
                radial-gradient(circle, #c9b08a 0 2.5px, transparent 2.5px) 0 50% / 12px 12px no-repeat,
                radial-gradient(circle, #c9b08a 0 2.5px, transparent 2.5px) 100% 50% / 12px 12px no-repeat;
        }

        /* 四角回纹角饰 */
        .frame-corner {
            position: absolute;
            width: 30px;
            height: 30px;
            z-index: 1;
            pointer-events: none;
        }
        .frame-corner--tl { top: 8px; left: 8px; }
        .frame-corner--tr { top: 8px; right: 8px; transform: rotate(90deg); }
        .frame-corner--br { bottom: 8px; right: 8px; transform: rotate(180deg); }
        .frame-corner--bl { bottom: 8px; left: 8px; transform: rotate(270deg); }

        /* 顶部装饰线 */
        .ornament {
            margin: 0 auto 28px;
            width: 48px;
            height: 2px;
            background: #d9c6a9;
            border-radius: 2px;
        }

        /* 新人姓名 — clamp 随屏自适应，窄屏自动缩小不折行 */
        .couple-names {
            font-size: clamp(1.55rem, 8vw, 3rem);
            font-weight: 400;
            letter-spacing: clamp(2px, 1.1vw, 5px);
            color: #1e1e1e;
            line-height: 1.2;
            margin-bottom: 16px;
            font-family: 'Huiwen Mincho', 'Cormorant Garamond', 'Times New Roman', 'Songti SC', serif;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .couple-names span {
            display: inline-block;
            margin: 0 clamp(3px, 1.5vw, 8px);
            font-weight: 300;
            color: #c2a57a;
            font-size: 0.73em;
            transform: translateY(-2px);
        }

        /* 日期 */
        .wedding-date {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 6px;
            color: #777;
            margin-bottom: 28px;
            text-transform: uppercase;
            font-family: 'Huiwen Mincho', 'Noto Serif SC', 'Songti SC', serif;
        }

        /* 农历日期行 — 香槟色调，柔和居中 */
        .lunar-date {
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 2px;
            color: #b49b78;
            margin-top: -16px;
            margin-bottom: 28px;
            font-family: 'Huiwen Mincho', 'Noto Serif SC', 'Songti SC', serif;
        }

        /* 照片区域 — 主次分明布局 */
        .photo-gallery {
            width: 100%;
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 主照片 — 有图时显示图片（框随图片比例自适应），无图时显示占位样式 */
        .main-photo {
            width: 100%;
            min-height: 280px;
            background: #faf5ed;
            border-radius: 24px;
            border: 1px solid #e9dcc8;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #b5a18a;
            font-size: 1rem;
            letter-spacing: 1.5px;
            transition: transform 0.2s;
            padding: 20px;
            overflow: hidden;
        }

        .main-photo i {
            font-style: normal;
            font-size: 2.8rem;
            margin-bottom: 12px;
            color: #cdba9d;
            font-weight: 200;
            line-height: 1;
        }
        .main-photo span {
            font-size: 0.8rem;
            color: #bba88d;
        }

        /* 照片加载成功后的显示规则（主图与副图通用） */
        .main-photo img,
        .secondary-photo img {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* 主图：高度跟随图片比例自适应（副图仍固定 1:1 方框裁切） */
        .main-photo img {
            height: auto;
        }
        .main-photo.has-photo,
        .secondary-photo.has-photo {
            padding: 0;
            background: none;
        }
        .main-photo.has-photo img,
        .secondary-photo.has-photo img {
            display: block;
        }
        .main-photo.has-photo :not(img),
        .secondary-photo.has-photo :not(img) {
            display: none;
        }

        /* 次要照片 — 四张整齐排列 */
        .secondary-photos {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
        }

        .secondary-photo {
            aspect-ratio: 1 / 1;
            background: #faf7f0;
            border-radius: 16px;
            border: 1px solid #eee3d3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #b5a18a;
            font-size: 0.65rem;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            transition: transform 0.2s;
            padding: 8px;
            text-align: center;
            overflow: hidden;
        }

        .secondary-photo i {
            font-style: normal;
            font-size: 1.5rem;
            margin-bottom: 4px;
            color: #cdba9d;
            font-weight: 200;
        }

        .secondary-photo span {
            font-size: 0.6rem;
            color: #bbaa93;
            line-height: 1.3;
        }

        /* 婚礼信息 */
        .details {
            text-align: left;
            margin-bottom: 28px;
            background: transparent;
            padding: 8px 0;
        }

        .detail-item {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 12px;
            font-size: 1rem;
            padding: 12px 0;
            color: #3a3a3a;
            border-bottom: 1px solid rgba(210, 190, 160, 0.3);
        }

        .detail-item:last-of-type {
            border-bottom: none;
        }

        .detail-label {
            font-weight: 500;
            letter-spacing: 1px;
            color: #9e8b72;
            min-width: 72px;
            text-align: right;
            font-size: 0.9rem;
        }

        .detail-value {
            font-weight: 400;
            color: #2e2e2e;
            letter-spacing: 1px;
            text-align: left;
            flex: 1;
        }

        .location-highlight {
            font-weight: 500;
            color: #1a1a1a;
        }

        /* 恭候光临 — 独立香槟色居中区块 */
        .greeting-line {
            margin: 20px 0 10px;
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: #b49b78;      /* 香槟色调 */
            font-weight: 400;
            text-align: center;  /* 居中 */
            border-top: 1px solid rgba(210, 190, 160, 0.3);
            padding-top: 20px;
            font-family: 'Huiwen Mincho', 'Noto Serif SC', 'Songti SC', serif;
        }

        /* 右上角背景音乐浮动按钮 — 封面开启后再浮现 */
        .music-btn {
            position: fixed;
            top: 18px;
            right: 18px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(217, 198, 169, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 850;              /* 高于花瓣层(800)，低于灯箱(950) */
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.07);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            opacity: 0;
            visibility: hidden;
            /* 开启封面后延迟浮现（等封面淡出完成），延迟只作用于 opacity/visibility */
            transition: opacity 0.5s ease 0.9s, visibility 0.5s ease 0.9s,
                        background 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
        }

        body.cover-opened .music-btn {
            opacity: 1;
            visibility: visible;
        }

        .music-btn:hover {
            background: rgba(255, 252, 246, 0.92);
            border-color: #bfa888;
        }

        .music-btn:active {
            transform: scale(0.94);
        }

        .music-btn svg {
            width: 18px;
            height: 18px;
            fill: #b49b78;
            opacity: 0.55;
            transition: opacity 0.25s ease;
        }

        /* 播放中：音符点亮并旋转 */
        .music-btn.playing svg {
            opacity: 1;
            animation: music-spin 4s linear infinite;
        }

        @keyframes music-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .divider-light {
            width: 70px;
            height: 1.5px;
            background: #dacbad;
            margin: 24px auto 18px;
            border-radius: 1px;
        }

        /* RSVP 区域 */
        .rsvp-section {
            margin-top: 8px;
        }

        .rsvp-title {
            font-size: 0.95rem;
            letter-spacing: 3px;
            color: #7f6e5a;
            margin-bottom: 18px;
            font-weight: 400;
            text-transform: uppercase;
            font-family: 'Huiwen Mincho', 'Noto Serif SC', 'Songti SC', serif;
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
        }

        .input-row {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 340px;
            gap: 6px;
        }

        .input-label {
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: #9e8b72;
            text-align: left;
        }

        .name-input,
        .phone-input,
        .select-input {
            width: 100%;
            padding: 13px 18px;
            border: 1px solid #ddd0bd;
            border-radius: 40px;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            text-align: center;
            background: rgba(255, 255, 255, 0.8);
            color: #2c2c2c;
            outline: none;
            transition: all 0.25s ease;
            font-family: inherit;
            backdrop-filter: blur(4px);
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        .name-input::placeholder,
        .phone-input::placeholder {
            color: #b9a88f;
            letter-spacing: 1px;
            font-weight: 300;
        }

        .name-input:focus,
        .phone-input:focus,
        .select-input:focus {
            border-color: #bfa888;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(190, 168, 136, 0.1);
        }

        .select-input {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8" viewBox="0 0 12 8"><path fill="%23b49b78" d="M6 8L0 0h12z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 18px center;
            padding-right: 40px;
        }

        .submit-btn {
            background: #ffffffd9;
            border: 1px solid #cbb694;
            color: #4a3f31;
            padding: 12px 36px;
            border-radius: 40px;
            font-size: 0.9rem;
            letter-spacing: 3px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            background: #fcf7f0;
            margin-top: 8px;
            width: fit-content;
            font-family: inherit;
            backdrop-filter: blur(4px);
        }

        .submit-btn:hover {
            background: #f7efe4;
            border-color: #ae9472;
            letter-spacing: 4px;
        }

        .submit-btn:active {
            background: #efe3d3;
            transform: scale(0.98);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: wait;
            letter-spacing: 3px;
        }

        .submission-message {
            margin-top: 18px;
            font-size: 0.85rem;
            color: #6b5d4b;
            letter-spacing: 1px;
            min-height: 24px;
            transition: opacity 0.3s;
            text-align: center;
        }

        .footer-note {
            margin-top: 26px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: #bcab94;
            text-transform: uppercase;
            font-family: 'Huiwen Mincho', 'Noto Serif SC', 'Songti SC', serif;
        }

        /* ===== 中式古典元素 ===== */

        /* 开屏封面 — 卷轴信封 */
        .cover-screen {
            position: fixed;
            inset: 0;
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #f7eedd 0%, #f3e5cc 50%, #eedbbd 100%);
            transition: opacity 0.9s ease, visibility 0.9s;
        }

        .cover-screen.opened {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .cover-inner {
            text-align: center;
            padding: 48px 32px;
            max-width: 400px;
            width: 100%;
            animation: cover-in 1.4s ease both;
        }

        @keyframes cover-in {
            from { opacity: 0; transform: translateY(26px) scale(0.97); }
            to { opacity: 1; transform: none; }
        }

        .cover-frame {
            border: 1px solid #c9b08a;
            outline: 1px solid #c9b08a;
            outline-offset: 5px;
            padding: 44px 28px;
            background: rgba(255, 252, 245, 0.5);
        }

        .cover-kicker {
            font-size: 0.8rem;
            letter-spacing: 8px;
            color: #a08a68;
            margin-bottom: 26px;
            font-family: 'Huiwen Mincho', 'Noto Serif SC', serif;
        }

        .cover-names {
            font-size: 2.1rem;
            letter-spacing: 6px;
            color: #3d3226;
            margin-bottom: 8px;
            font-family: 'Huiwen Mincho', 'Noto Serif SC', serif;
            white-space: nowrap;
        }

        .cover-names .amp {
            color: #b08d5e;
            font-size: 0.72em;
            margin: 0 6px;
        }

        .cover-date {
            font-size: 0.85rem;
            letter-spacing: 4px;
            color: #8a7658;
            margin-top: 18px;
            font-family: 'Huiwen Mincho', 'Noto Serif SC', serif;
        }

        .cover-open-btn {
            margin-top: 30px;
            padding: 11px 44px;
            background: transparent;
            border: 1px solid #b39872;
            color: #6d5c42;
            font-size: 0.9rem;
            letter-spacing: 6px;
            font-family: 'Huiwen Mincho', 'Noto Serif SC', serif;
            cursor: pointer;
            transition: all 0.3s ease;
            text-indent: 6px; /* 抵消 letter-spacing 让文字视觉居中 */
        }

        .cover-open-btn:hover {
            background: rgba(179, 152, 114, 0.12);
            letter-spacing: 8px;
        }

        .cover-seal {
            position: absolute;
            right: 26px;
            bottom: 26px;
            width: 58px;
            height: 58px;
            border: 2px solid #b5432f;
            border-radius: 6px;
            color: #b5432f;
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(6deg);
            font-family: 'Huiwen Mincho', 'Noto Serif SC', serif;
            opacity: 0.85;
            user-select: none;
        }

        /* 卷轴展开后的入场 */
        .invitation-card {
            animation: card-rise 1s ease both;
            animation-delay: 0.15s;
        }

        .cover-screen.opened ~ main.invitation-card,
        body.cover-opened .invitation-card {
            animation: card-rise 1.1s cubic-bezier(0.22, 0.8, 0.36, 1) both;
        }

        @keyframes card-rise {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: none; }
        }

        /* 飘落花瓣画布 */
        #petalsCanvas {
            position: fixed;
            inset: 0;
            z-index: 800;
            pointer-events: none;
            display: none;
        }

        /* 倒计时 */
        .countdown-section {
            margin: 26px 0 6px;
            text-align: center;
        }

        .countdown-title {
            font-size: 0.85rem;
            letter-spacing: 5px;
            color: #9e8b72;
            margin-bottom: 14px;
            font-family: 'Huiwen Mincho', 'Noto Serif SC', serif;
        }

        .countdown-grid {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .count-cell {
            min-width: 62px;
            padding: 10px 6px 8px;
            background: rgba(255, 253, 248, 0.75);
            border: 1px solid #e3d5bd;
            border-radius: 10px;
        }

        .count-num {
            font-size: 1.55rem;
            font-weight: 600;
            color: #6d5a40;
            line-height: 1.15;
            font-variant-numeric: tabular-nums;
            font-family: 'Huiwen Mincho', 'Noto Serif SC', serif;
        }

        .count-label {
            font-size: 0.68rem;
            letter-spacing: 3px;
            color: #ab9878;
            margin-top: 3px;
        }

        /* 地址卡 + 导航 */
        .venue-card {
            margin: 6px 0 26px;
            padding: 20px 22px;
            border: 1px solid #e6d9c2;
            border-radius: 14px;
            background: rgba(255, 253, 248, 0.6);
            text-align: center;
        }

        .venue-name {
            font-size: 1.05rem;
            letter-spacing: 3px;
            color: #4a3f2f;
            margin-bottom: 6px;
            font-family: 'Huiwen Mincho', 'Noto Serif SC', serif;
        }

        .venue-addr {
            font-size: 0.82rem;
            color: #8f7d63;
            letter-spacing: 1px;
            margin-bottom: 14px;
        }

        .venue-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .venue-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 20px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            border-radius: 30px;
            border: 1px solid #c9b08a;
            background: rgba(255, 252, 246, 0.9);
            color: #6d5c42;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            font-family: inherit;
        }

        .venue-btn:hover {
            background: #f7efdf;
            border-color: #b39872;
        }

        .venue-btn:active {
            transform: scale(0.96);
        }

        .venue-btn svg {
            width: 13px;
            height: 13px;
            fill: #a08a68;
        }

        /* 照片灯箱 */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 950;
            background: rgba(24, 20, 14, 0.92);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }

        .lightbox.show {
            display: flex;
            animation: lb-in 0.3s ease;
        }

        @keyframes lb-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .lightbox img {
            max-width: 100%;
            max-height: 76vh;
            border-radius: 8px;

        .lightbox-caption {
            color: #cbb994;
            font-size: 0.82rem;
            letter-spacing: 3px;
            margin-top: 16px;
            font-family: 'Huiwen Mincho', 'Noto Serif SC', serif;

        .lightbox-close {
            position: absolute;
            top: 18px;
            right: 20px;
            width: 38px;
            height: 38px;

            border: 1px solid rgba(203, 185, 148, 0.5);

        .lightbox-prev { left: 14px; }

        /* 可点击照片的提示光标 */

        .secondary-photo.has-photo {
            cursor: zoom-in;

        /* 地图选择层 */
        .map-picker {
            position: fixed;
            inset: 0;
            z-index: 960;
            background: rgba(24, 20, 14, 0.55);
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        .map-picker.show {
            display: flex;
            animation: mp-in 0.25s ease;
        }

        @keyframes mp-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .map-picker-panel {
            background: #fffcf5;
            width: 100%;
            max-width: 420px;
            border-radius: 22px 22px 0 0;
            padding: 26px 22px 20px;
            text-align: center;
            animation: mp-up 0.3s ease;
        }

        @keyframes mp-up {
            from { transform: translateY(40px); }
            to { transform: none; }

        .map-picker-title {
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: #6d5c42;
            margin-bottom: 20px;
            font-family: 'Huiwen Mincho', 'Noto Serif SC', serif;

        .map-picker-list {
            display: flex;

        .map-picker-list a {

            border-radius: 14px;

        .map-icon {

    <audio id="bgMusic" loop preload="auto" autoplay style="display: none;">
        <source src="assets/music/bgm.mp3" type="audio/mpeg">
    </audio>

    <script>
        (function() {
            // ----- 获取表单元素 -----
            const nameInput = document.getElementById('guestName');
            const accommodationSelect = document.getElementById('needAccommodation');
            const phoneInput = document.getElementById('phoneNumber');
            const submitBtn = document.getElementById('submitFormBtn');
            const messageDiv = document.getElementById('confirmationMessage');
            const storageKey = 'wedding_guest_details_bodhi_yin';

            // 尝试读取之前保存的信息（如果有）
            function loadStoredData() {
                try {
                    const stored = localStorage.getItem(storageKey);
                    if (stored) {
                        const data = JSON.parse(stored);
                        if (data.name) {
                            nameInput.value = data.name || '';
                            if (data.accommodation) accommodationSelect.value = data.accommodation;
                            if (data.phone) phoneInput.value = data.phone;
                            messageDiv.textContent = `欢迎回来，${data.name}。如需修改信息可直接更新。`;
                            messageDiv.style.color = '#6b5d4b';
                        }
                    }
                } catch (e) {}
            }

            // 提交登记信息：调用同域边缘函数 /api/rsvp 写入 KV 存储
            async function handleSubmit() {
                const rawName = nameInput.value.trim();
                const accommodation = accommodationSelect.value;
                const phone = phoneInput.value.trim();

                // 基本验证
                if (rawName === '') {
                    messageDiv.textContent = '请填写您的姓名。';
                    messageDiv.style.color = '#b33a3a';
                    nameInput.focus();
                    return;
                }
                const namePattern = /^[一-龥A-Za-z\s·.]+$/;
                if (!namePattern.test(rawName)) {
                    messageDiv.textContent = '姓名格式似乎不太对，请使用中文、英文或空格。';
                    messageDiv.style.color = '#b33a3a';
                    return;
                }
                if (accommodation === '') {
                    messageDiv.textContent = '请选择是否需要住宿。';
                    messageDiv.style.color = '#b33a3a';
                    accommodationSelect.focus();
                    return;
                }
                // 电话可选，但如果填写则简单校验
                if (phone !== '') {
                    const phonePattern = /^[0-9+\-\s]{6,20}$/;
                    if (!phonePattern.test(phone)) {
                        messageDiv.textContent = '联系电话格式可能不正确，请检查。';
                        messageDiv.style.color = '#b33a3a';
                        phoneInput.focus();
                        return;
                    }
                }

                // 构建数据对象并本地留档（便于下次回填，也是网络异常时的降级保存）
                const formData = {
                    name: rawName,
                    accommodation: accommodation,
                    phone: phone,
                    timestamp: new Date().toISOString()
                };
                try {
                    localStorage.setItem(storageKey, JSON.stringify(formData));
                } catch (e) {}

                // 提交到服务端；失败时降级为本地保存并提示
                submitBtn.disabled = true;
                try {
                    const res = await fetch('/api/rsvp', {
                        method: 'POST',
                        headers: { 'content-type': 'application/json' },
                        body: JSON.stringify({
                            name: rawName,
                            accommodation: accommodation,
                            phone: phone
                        })
                    });
                    const data = await res.json().catch(() => ({}));

                    if (res.ok && data.ok) {
                        messageDiv.textContent = `感谢您的回复，${rawName}！期待与您相聚。`;
                        messageDiv.style.color = '#3f6e4a';
                    } else {
                        messageDiv.textContent = (data && data.error)
                            ? data.error
                            : '提交暂时没有成功，您的信息已在本机保存，请稍后再试一次。';
                        messageDiv.style.color = '#b33a3a';
                    }
                } catch (e) {
                    // 网络异常或接口未部署（如纯静态托管）：本地保存兜底
                    messageDiv.textContent = '网络不太顺畅，您的信息已在本机保存。请稍后再试，或直接联系新人。';
                    messageDiv.style.color = '#b33a3a';
                } finally {
                    setTimeout(() => { submitBtn.disabled = false; }, 2000);
                }
            }

            submitBtn.addEventListener('click', handleSubmit);

            // 回车提交
            [nameInput, phoneInput].forEach(input => {
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        handleSubmit();
                    }
                });
            });

            // 加载已有数据
            loadStoredData();

            // ----- 背景音乐控制 -----
            const musicBtn = document.getElementById('musicBtn');
            const bgMusic = document.getElementById('bgMusic');
            let isPlaying = false;

            // 若 bgm.mp3 真实加载失败（如未放置），由 <audio> 的 error 事件隐藏按钮。
            // 不用 fetch HEAD 探测：EdgeOne 预览链接的令牌不随 fetch 转发，会误判 401。
            function hideMusicBtn() {
                musicBtn.style.display = 'none';
            }
            bgMusic.addEventListener('error', hideMusicBtn);
            // source 元素的错误不会冒泡到 audio，需要挂在 source 上
            const bgSource = bgMusic.querySelector('source');
            if (bgSource) bgSource.addEventListener('error', hideMusicBtn);

            function setPlayingUI(playing) {
                if (playing) {
                    musicBtn.classList.add('playing');
                    musicBtn.setAttribute('aria-pressed', 'true');
                } else {
                    musicBtn.classList.remove('playing');
                    musicBtn.setAttribute('aria-pressed', 'false');
                }
            }

            function startMusic() {
                if (isPlaying) return;
                isPlaying = true;
                setPlayingUI(true);
                bgMusic.play().catch(() => {
                    // 自动播放被浏览器拦截：回退为关闭，等首次手势再启动
                    isPlaying = false;
                    setPlayingUI(false);
                });
            }

            function stopMusic() {
                isPlaying = false;
                bgMusic.pause();
                bgMusic.currentTime = 0;
                setPlayingUI(false);
            }

            function toggleMusic() {
                if (isPlaying) {
                    stopMusic();
                } else {
                    startMusic();
                }
            }

            // 默认打开音乐：先尝试自动播放；若被浏览器拦截，则在用户首次点击/触摸页面任意位置时启动
            // <audio autoplay> 与 JS play() 双通道都试，谁先成功算谁的
            startMusic();

            // audio 元素自身 autoplay 成功时（如微信 iOS），同步 UI 状态
            bgMusic.addEventListener('play', () => { isPlaying = true; setPlayingUI(true); });
            bgMusic.addEventListener('pause', () => { if (!bgMusic.ended) { isPlaying = false; setPlayingUI(false); } });

            // 自动播放被拦截时的兜底：首次任意手势（点击/触摸/按键/滚动）即启动
            // 用户明确点音乐按钮关闭时（userMuted 置位）不再自动启动
            let userMuted = false;
            musicBtn.addEventListener('click', () => { userMuted = true; });
            ['click', 'touchstart', 'keydown', 'wheel'].forEach(evt => {
                document.addEventListener(evt, function onFirstGesture() {
                    document.removeEventListener(evt, onFirstGesture);
                    if (!isPlaying && !userMuted) startMusic();
                }, { passive: true });
            });
            // 微信内自动播放的补充通道
            document.addEventListener('WeixinJSBridgeReady', function () {
                if (window.WeixinJSBridge) {
                    WeixinJSBridge.invoke('setKeepScreenOn', {}, function () {});
                }
                startMusic();
            });
            // 已错过 WeixinJSBridgeReady 事件的情况（脚本晚于事件执行）
            if (window.WeixinJSBridge) startMusic();

            musicBtn.addEventListener('click', toggleMusic);
            musicBtn.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleMusic();
                }
            });

            // ----- 开屏封面：点击开启 → 展开请柬 + 启动音乐 + 花瓣 -----
            const coverScreen = document.getElementById('coverScreen');
            const coverOpenBtn = document.getElementById('coverOpenBtn');
            const petalsCanvas = document.getElementById('petalsCanvas');

            let petalsStarted = false;

            function startPetals() {
                if (petalsStarted) return;
                petalsStarted = true;
                petalsCanvas.style.display = 'block';
                const ctx = petalsCanvas.getContext('2d');
                let W, H;
                const PETAL_COUNT = 16;   // 数量克制，避免喧宾夺主

                function resize() {
                    W = petalsCanvas.width = window.innerWidth;
                    H = petalsCanvas.height = window.innerHeight;
                }
                resize();
                window.addEventListener('resize', resize);

                // 花瓣：椭圆 + 旋转 + 摇摆飘落
                const petals = [];
                for (let i = 0; i < PETAL_COUNT; i++) {
                    petals.push({
                        x: Math.random() * window.innerWidth,
                        y: Math.random() * -window.innerHeight,
                        size: 6 + Math.random() * 7,
                        speed: 0.4 + Math.random() * 0.8,
                        sway: 0.5 + Math.random() * 1.2,
                        swaySpeed: 0.008 + Math.random() * 0.012,
                        phase: Math.random() * Math.PI * 2,
                        rot: Math.random() * Math.PI * 2,
                        rotSpeed: (Math.random() - 0.5) * 0.02,
                        hue: 8 + Math.random() * 18,        // 粉白到淡粉
                        alpha: 0.5 + Math.random() * 0.35
                    });
                }

                function draw() {
                    ctx.clearRect(0, 0, W, H);
                    for (const p of petals) {
                        p.phase += p.swaySpeed;
                        p.rot += p.rotSpeed;
                        p.y += p.speed;
                        p.x += Math.sin(p.phase) * p.sway * 0.4;
                        if (p.y > H + 20) {           // 落出底部回到顶部
                            p.y = -20;
                            p.x = Math.random() * W;
                        }
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.rot);
                        ctx.globalAlpha = p.alpha;
                        // 花瓣形状：两段贝塞尔构成的叶片
                        ctx.beginPath();
                        ctx.moveTo(0, -p.size);
                        ctx.bezierCurveTo(p.size * 0.9, -p.size * 0.5, p.size * 0.7, p.size * 0.6, 0, p.size);
                        ctx.bezierCurveTo(-p.size * 0.7, p.size * 0.6, -p.size * 0.9, -p.size * 0.5, 0, -p.size);
                        ctx.fillStyle = `hsl(${p.hue}, 70%, 88%)`;
                        ctx.fill();
                        ctx.restore();
                    }
                    requestAnimationFrame(draw);
                }
                draw();
            }

            function openCover() {
                coverScreen.classList.add('opened');
                document.body.classList.add('cover-opened');
                startMusic();          // 用户手势内启动音乐，绕过自动播放限制
                startPetals();
            }
            coverOpenBtn.addEventListener('click', openCover);

            // ----- 婚礼倒计时（2026-10-03 12:00 正午，按本地时区） -----
            const WEDDING_TS = new Date('2026-10-03T12:00:00+08:00').getTime();
            const cdEls = {
                d: document.getElementById('cdDays'),
                h: document.getElementById('cdHours'),
                m: document.getElementById('cdMins'),
                s: document.getElementById('cdSecs')
            };
            const pad = n => String(n).padStart(2, '0');

            function tickCountdown() {
                let diff = WEDDING_TS - Date.now();
                const sec = Math.floor(diff / 1000);
                if (sec <= 0) {
                    cdEls.d.textContent = '囍';
                    cdEls.h.textContent = '';
                    cdEls.m.textContent = '';
                    cdEls.s.textContent = '';
                    document.querySelector('.countdown-title').textContent = '今 朝 花 好 月 圆';
                    return;
                }
                cdEls.d.textContent = Math.floor(sec / 86400);
                cdEls.h.textContent = pad(Math.floor(sec / 3600) % 24);
                cdEls.m.textContent = pad(Math.floor(sec / 60) % 60);
                cdEls.s.textContent = pad(sec % 60);
                setTimeout(tickCountdown, 1000 - (Date.now() % 1000));
            }
            tickCountdown();

            // ----- 照片灯箱 -----
            const lb = document.getElementById('lightbox');
            const lbImg = document.getElementById('lbImg');
            const lbCaption = document.getElementById('lbCaption');
            const photoSources = [
                { src: 'assets/images/main.jpg', cap: '主婚纱照' },
                { src: 'assets/images/photo1.jpg', cap: '一' },
                { src: 'assets/images/photo2.jpg', cap: '二' },
                { src: 'assets/images/photo3.jpg', cap: '三' },
                { src: 'assets/images/photo4.jpg', cap: '四' }
            ];
            let lbIndex = 0;
            // 灯箱始终使用完整列表；未加载成功（无 has-photo）的照片在翻页时自动跳过。
            // 是否可显示以页面上 img 的 onload（has-photo 类）为准，不做缓存探测。
            const lbList = photoSources;

            function lbAvailable(i) {
                const el = document.querySelector('[data-lb="' + i + '"]');
                return el && el.classList.contains('has-photo');
            }

            function lbShow(start) {
                if (!lbList.length) return;
                // 从 start 起向后找最近一张实际存在的照片（循环查找；start 先取模归一化）
                let i = ((start % lbList.length) + lbList.length) % lbList.length;
                for (let n = 0; n < lbList.length; n++) {
                    if (lbAvailable(i)) break;
                    i = (i + 1) % lbList.length;
                }
                lbIndex = i;
                lbImg.src = lbList[i].src;
                lbCaption.textContent = lbList[i].cap;
                lb.classList.add('show');
            }
            function lbHide() { lb.classList.remove('show'); }
            document.querySelectorAll('[data-lb]').forEach(el => {
                el.addEventListener('click', () => {
                    if (!el.classList.contains('has-photo')) return;
                    lbShow(Number(el.dataset.lb));   // data-lb 即完整列表的索引
                });
            });
            document.getElementById('lbClose').addEventListener('click', lbHide);
            document.getElementById('lbPrev').addEventListener('click', () => lbShow(lbIndex - 1));
            document.getElementById('lbNext').addEventListener('click', () => lbShow(lbIndex + 1));
            lb.addEventListener('click', (e) => { if (e.target === lb) lbHide(); });
            document.addEventListener('keydown', (e) => {
                if (!lb.classList.contains('show')) return;
                if (e.key === 'Escape') lbHide();
                if (e.key === 'ArrowLeft') lbShow(lbIndex - 1);
                if (e.key === 'ArrowRight') lbShow(lbIndex + 1);
            });

            // ----- 地址卡：复制地址 + 地图导航 -----
            const VENUE_ADDR = '河北省保定市易县好年景烤鸭店 · 朝阳西路28号';
            // 酒店真实坐标（GCJ-02，来自高德分享链接）
            const VENUE = { lat: 39.34814079447526, lng: 115.49771860241889, name: '好年景烤鸭店', addr: '朝阳西路28号' };
            document.getElementById('venueAddr').textContent = VENUE_ADDR;

            // 三家地图定位链接（高德/腾讯同为 GCJ-02 坐标系；百度 BD-09 需偏移换算）
            const bdLat = VENUE.lat + 0.006;       // GCJ-02 → BD-09 近似偏移
            const bdLng = VENUE.lng + 0.0065;
            const NAV_LINKS = {
                amap: 'https://uri.amap.com/marker?position=' + VENUE.lng + ',' + VENUE.lat
                    + '&name=' + encodeURIComponent(VENUE.name) + '&src=wedding&coordinate=gaode',
                qq: 'https://apis.map.qq.com/uri/v1/marker?marker=coord:' + VENUE.lat + ',' + VENUE.lng
                    + ';title:' + encodeURIComponent(VENUE.name) + ';addr:' + encodeURIComponent(VENUE.addr)
                    + '&referer=wedding',
                baidu: 'https://api.map.baidu.com/marker?location=' + bdLat + ',' + bdLng
                    + '&title=' + encodeURIComponent(VENUE.name) + '&content=' + encodeURIComponent(VENUE.addr)
                    + '&coord_type=bd09ll&output=html&src=wedding'
            };

            // 点「地图导航」弹出选择层：三家地图任选
            // 说明：微信内无法探测/唤起地图 App（scheme 被拦截），统一走网页版地图，
            // 网页版自身会引导打开对应 App；外部浏览器点选后由 uri.amap.com 等自动唤起。
            const mapPicker = document.getElementById('mapPicker');
            document.getElementById('navBtn').addEventListener('click', (e) => {
                e.preventDefault();
                mapPicker.classList.add('show');
            });
            document.getElementById('mapPickerClose').addEventListener('click', () => mapPicker.classList.remove('show'));
            mapPicker.addEventListener('click', (e) => { if (e.target === mapPicker) mapPicker.classList.remove('show'); });
            document.querySelectorAll('[data-map]').forEach(a => {
                a.href = NAV_LINKS[a.dataset.map];
                a.addEventListener('click', () => setTimeout(() => mapPicker.classList.remove('show'), 300));
            });

            const copyBtn = document.getElementById('copyAddrBtn');
            copyBtn.addEventListener('click', async () => {
                const done = () => {
                    copyBtn.textContent = '已复制 ✓';
                    setTimeout(() => { copyBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg> 复制地址'; }, 1600);
                };
                try {
                    await navigator.clipboard.writeText(VENUE_ADDR);
                    done();
                } catch (e) {
                    // 旧 WebView 降级：execCommand
                    const ta = document.createElement('textarea');
                    ta.value = VENUE_ADDR;
                    ta.style.cssText = 'position:fixed;opacity:0';
                    document.body.appendChild(ta);
                    ta.select();
                    try { document.execCommand('copy'); done(); } catch (e2) {}
                    ta.remove();
                }
            });
        })();
    </script>
</body>
